<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cofarmen - Sistema de Asistencia</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="LOGO COFAR.jpeg" alt="Cofarmen Logo">
        </div>

        <h2>Cofarmen</h2>
        <p style="color: #666; margin-top: -15px; font-size: 0.85rem; margin-bottom: 20px;">
            Sistema de Asistencia
        </p>

        <div class="input-group">
            <input type="number" id="dni" placeholder="Ingrese su DNI" inputmode="numeric">
            <input type="password" id="pin" placeholder="Ingrese su PIN">
        </div>

        <button onclick="procesarAsistencia()">Registrar Asistencia</button>

        <div id="status-message">Esperando ingreso...</div>

        <div id="reader" style="display: none;"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
