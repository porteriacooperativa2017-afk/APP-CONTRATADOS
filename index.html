<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cofarmen - Sistema de Asistencia</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
    <div class="container">
        <!-- Nombre de archivo verificado en imagen b210aab7-e2eb-4ff4-93e0-2be5b2bd2e2f -->
        <img src="LOGO COFAR.jpeg" alt="LOGO COFAR" class="logo">
        <h1 class="titulo-verde">COFARMEN</h1>
        <p class="subtitulo">SISTEMA DE ASISTENCIA</p>
        
        <div id="formulario">
            <div class="input-group">
                <label>DNI</label>
                <input type="number" id="dni" placeholder="Ingrese DNI">
            </div>
            <div class="input-group">
                <label>PIN</label>
                <input type="password" id="pin" placeholder="••••">
            </div>
            
            <button onclick="procesarAsistencia()" class="btn-registro">REGISTRAR ASISTENCIA</button>
            
            <div class="banner-rojo">
                EL REGISTRO DE PAUSA REQUIERE ESCANEO EN GUARDIA
            </div>
        </div>

        <div id="reader" style="display: none; width: 100%;"></div>
        <p id="mensaje"></p>
    </div>
    <script src="script.js?v=final_prod"></script>
</body>
</html>
