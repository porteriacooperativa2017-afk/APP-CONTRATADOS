<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cofarmen - Registro de Personal</title>
    <link rel="stylesheet" href="style.css">
    <!-- Librería de QR que ya te funcionaba -->
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
    <div class="container">
        <img src="logo-cofarmen.png" alt="Logo Cofarmen" class="logo">
        <h2>Control de Asistencia</h2>
        
        <div id="seccion-dni">
            <div class="input-group">
                <label for="dni">DNI del Personal</label>
                <input type="number" id="dni" placeholder="Ingrese DNI sin puntos" required>
            </div>
            <button onclick="iniciarEscaneo()" class="btn-principal">Validar con QR Guardia</button>
        </div>

        <div id="reader" style="display: none; width: 100%;"></div>
        <p id="mensaje"></p>
    </div>

    <!-- Forzamos la carga del script nuevo -->
    <script src="script.js?v=final_rev_05"></script>
</body>
</html>
